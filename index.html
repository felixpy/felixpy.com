<!doctype html>

    <meta name="theme-color" content="#101519" />
    <meta
      name="description"
      content="Felix Studio is Felix Yang’s open-source interactive 3D portfolio. Explore a virtual workspace built with React and Three.js, listen to music, and play Orbital Patrol."

    <link rel="canonical" href="https://felixpy.com/" />

      property="og:description"
      content="Explore Felix Yang’s interactive 3D workspace, built with React and Three.js."

    <meta property="og:url" content="https://felixpy.com/" />

      property="og:image"
      content="https://felixpy.com/media/graphics/felix-studio-preview.jpg"
    />
    <meta property="og:image:alt" content="The desk, window, and computer in Felix Studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@gofelixpy" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Felix Studio",

        min-height: 100svh;
        padding: clamp(24px, 7vw, 96px);
        background: #060b0f;
        color: #eef4f7;
        font-family: system-ui, sans-serif;
      }
      body:has(#studio-intro) {
        margin: 0;
      }
      #studio-intro a {
        color: #c5eaf3;
      }
    </style>

  <body>
    <div id="root">
      <main id="studio-intro">
        <h1>Felix Studio</h1>
        <p>Felix Yang’s open-source interactive 3D portfolio, built with React and Three.js.</p>
        <p>
          Explore the 3D studio, change the skyline and weather, listen to music, and play Orbital
          Patrol.
        </p>
        <p>
          <a href="/about">About Felix Yang</a> ·
          <a href="https://github.com/felixpy/felixpy.com">View source</a>
        </p>

    <script type="module" src="/src/main.tsx"></script>
